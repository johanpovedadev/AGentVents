name: Escucha de mensajes de redes

on:
  # Botón "Run workflow" para correrlo a mano desde la pestaña Actions.
  workflow_dispatch:
  # Cada 2 horas en el minuto :43 (GitHub retrasa más las ejecuciones en punto).
  # Los mensajes no esperan un día: Johan quiere enterarse el mismo rato.
  schedule:
    - cron: '43 */2 * * *'

permissions:
  contents: read

# Nunca dos escuchas a la vez (por ejemplo, la programada y una manual).
concurrency:
  group: social-inbox
  cancel-in-progress: false

jobs:
  escuchar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Sin base de datos ni token de la página no hay nada que escuchar: en vez de fallar (cruz roja
      # y correo todos los días) se avisa en el resumen y se salta la corrida.
      - name: Revisar secretos
        id: secretos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LION_PLATFORM_BASE_URL: ${{ secrets.LION_PLATFORM_BASE_URL }}
          LION_EMAIL: ${{ secrets.LION_EMAIL }}
          LION_PASSWORD: ${{ secrets.LION_PASSWORD }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          faltan=""
          for v in DATABASE_URL LION_PLATFORM_BASE_URL LION_EMAIL LION_PASSWORD FB_PAGE_ID FB_PAGE_ACCESS_TOKEN; do
            [ -n "${!v}" ] || faltan="$faltan $v"
          done
          if [ -n "$faltan" ]; then
            echo "::warning::Escucha en pausa: faltan los secretos$faltan (Settings > Secrets and variables > Actions)."
            echo "### ⏸️ Escucha en pausa" >> "$GITHUB_STEP_SUMMARY"
            echo "Faltan los secretos:$faltan" >> "$GITHUB_STEP_SUMMARY"
            echo "listo=false" >> "$GITHUB_OUTPUT"
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar código
        if: steps.secretos.outputs.listo == 'true'
        uses: actions/checkout@v4

      - name: Configurar Node.js
        if: steps.secretos.outputs.listo == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        if: steps.secretos.outputs.listo == 'true'
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Aplicar migraciones pendientes
        if: steps.secretos.outputs.listo == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/migrate.js

      - name: Leer mensajes de Instagram y Messenger
        if: steps.secretos.outputs.listo == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LION_PLATFORM_BASE_URL: ${{ secrets.LION_PLATFORM_BASE_URL }}
          LION_EMAIL: ${{ secrets.LION_EMAIL }}
          LION_PASSWORD: ${{ secrets.LION_PASSWORD }}
          META_GRAPH_BASE_URL: ${{ secrets.META_GRAPH_BASE_URL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          SOCIAL_INBOX_TENANT_ID: ${{ secrets.SOCIAL_INBOX_TENANT_ID }}
          HERMES_BOT_TOKEN: ${{ secrets.HERMES_BOT_TOKEN }}
          HERMES_CHAT_ID: ${{ secrets.HERMES_CHAT_ID }}
        run: node scripts/collectMessages.js
